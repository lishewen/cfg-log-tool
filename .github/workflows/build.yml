name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli:
    name: CLI (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/CfgLogTool/CfgLogTool.csproj -c Release -r ${{ matrix.rid }} --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=true /p:TrimMode=partial
      - uses: actions/upload-artifact@v5
        with:
          name: cfglogtool-cli-${{ matrix.rid }}
          path: src/CfgLogTool/bin/Release/net10.0/${{ matrix.rid }}/publish/

  gui:
    name: GUI (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/CfgLogToolWpf/CfgLogToolWpf.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
      - uses: actions/upload-artifact@v5
        with:
          name: cfglogtool-gui-win-x64
          path: src/CfgLogToolWpf/bin/Release/net10.0-windows/win-x64/publish/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Package
        run: |
          cd artifacts
          for d in cfglogtool-*/; do
            name="${d%/}"
            (cd "$d" && zip -r "../${name}.zip" .)
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/*.zip --generate-notes --repo lishewen/cfg-log-tool
